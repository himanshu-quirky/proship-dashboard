<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prozoship MIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%231c1b18"/><path d="M11 21L21 11M12 11h9v9" stroke="%23fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@11/dist/motion.min.js"></script>
  <script src="/vendor/supabase.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    body { visibility: hidden; }
    body.auth-ready { visibility: visible; }
    #auth-loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0a0a0f; z-index: 9999; visibility: visible;
    }
    #auth-loader::after {
      content: ""; width: 32px; height: 32px; border: 3px solid #2a2a3a;
      border-top-color: #7c8cff; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    body.auth-ready #auth-loader { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="auth-loader" aria-hidden="true"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-mark">P</div>
        <div>
          <div class="logo-text">proship</div>
          <div class="logo-sub">MIS Workspace</div>
        </div>
      </div>
      <button id="sidebar-toggle" type="button" title="Toggle sidebar">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
    </div>
    <div class="nav-section-label">WORKSPACE</div>
    <nav class="sidebar-nav">
      <a class="nav-item active" data-view="delivery" href="#">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/></svg>
        <span>Summary</span>
      </a>
      <a class="nav-item" data-view="pickup" href="#">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Pending Shipments</span>
      </a>
      <a class="nav-item" data-view="cancellations" href="#">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
        <span>Actions</span>
        <span id="nav-actions-count" class="nav-count hidden">0</span>
      </a>
      <a class="nav-item" data-view="broadcast" href="#">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span>Notifications</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a class="nav-item" data-view="settings" href="#">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
      <div class="sb-theme" role="tablist">
        <button class="sb-theme-btn active" data-theme="light" type="button" title="Light">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <span>Light</span>
        </button>
        <button class="sb-theme-btn" data-theme="dark" type="button" title="Dark">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <span>Dark</span>
        </button>
      </div>
      <div id="sidebar-last-updated" class="sidebar-updated"></div>
    </div>
  </aside>

  <!-- Main wrap -->
  <div id="main-wrap">
    <!-- Top bar -->
    <header id="topbar">
      <div class="topbar-left">
        <span class="topbar-title">MIS Report &amp; Analysis</span>
      </div>
      <div class="topbar-right">
        <label class="topbar-search" title="Search">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input placeholder="Search shipments, AWB…" />
          <span class="kbd">⌘K</span>
        </label>
        <button id="upload-trigger-btn" class="btn btn-sm btn-outline">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload Reports
        </button>
        <div id="sync-badge" class="sync-badge hidden">
          <span class="sync-dot"></span>
          <span id="sync-badge-text">Synced</span>
        </div>
        <button id="notif-btn" class="icon-btn" title="Notifications">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span id="notif-badge" class="notif-badge hidden">0</span>
        </button>
      </div>
    </header>

    <!-- Date range bar (only visible on Summary view) -->
    <div id="date-range-bar" class="hidden">
      <div class="dr-left">
        <span class="dr-title">Date range:</span>
        <div class="dr-presets">
          <button class="dr-btn active" data-preset="today">Today</button>
          <button class="dr-btn" data-preset="7d">Last 7 days</button>
          <button class="dr-btn" data-preset="30d">Last 30 days</button>
          <button class="dr-btn" data-preset="3m">Last 3 months</button>
          <button class="dr-btn" data-preset="6m">Last 6 months</button>
          <button class="dr-btn" data-preset="custom">Custom</button>
        </div>
      </div>
      <div class="dr-custom hidden" id="dr-custom">
        <label class="dr-label">From</label>
        <input type="date" id="dr-from" class="dr-date-input" min="2025-12-01">
        <label class="dr-label">To</label>
        <input type="date" id="dr-to" class="dr-date-input" min="2025-12-01">
        <button class="btn btn-primary btn-sm" onclick="applyCustomRange()">Apply</button>
        <button class="btn btn-outline btn-sm" onclick="clearCustomRange()">Clear</button>
      </div>
      <div class="dr-active-label hidden" id="dr-active-label"></div>
    </div>

    <!-- Content -->
    <main id="content">
      <!-- Rendered by app.js -->
    </main>
  </div>

  <!-- Notification panel -->
  <div id="notif-overlay" class="overlay hidden"></div>
  <aside id="notif-panel" class="notif-panel hidden">
    <div class="notif-panel-header">
      <span class="notif-panel-title">Notifications</span>
      <button id="mark-all-read-btn" class="btn-text">Mark all read</button>
      <button id="notif-close-btn" class="icon-btn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="notif-list"></div>
  </aside>

  <!-- Upload modal -->
  <div id="upload-overlay" class="overlay hidden"></div>
  <div id="upload-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Upload Prozo Reports</span>
        <button class="icon-btn modal-close-btn">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="upload-drop-zone" class="upload-drop-zone">
        <div class="upload-icon">
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <p class="upload-label">Drop your Prozo HTML report files here</p>
        <p class="upload-hint">MIS Dashboard · Total Pending Summary · Raise with Proship</p>
        <input type="file" id="file-input" multiple accept=".html" style="display:none">
        <button class="btn btn-accent" id="choose-files-btn">Choose files</button>
      </div>
      <div id="upload-results" class="upload-results"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Search palette -->
  <div id="search-overlay" class="overlay hidden" style="z-index:400;background:rgba(0,0,0,0.5)"></div>
  <div id="search-palette" class="search-palette hidden">
    <div class="search-palette-input-wrap">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-palette-input" placeholder="Search AWBs, couriers, statuses…" autocomplete="off" spellcheck="false">
      <kbd class="kbd">ESC</kbd>
    </div>
    <div id="search-palette-results" class="search-palette-results"></div>
  </div>

  <script src="app.js"></script>
  <script>
    // Theme-refresh wiring (non-invasive — no app.js changes)
    (function() {
      const theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') document.body.classList.add('dark');
      document.querySelectorAll('.sb-theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
        btn.addEventListener('click', () => {
          const t = btn.dataset.theme;
          document.body.classList.toggle('dark', t === 'dark');
          localStorage.setItem('theme', t);
          document.querySelectorAll('.sb-theme-btn').forEach(b => b.classList.toggle('active', b === btn));
        });
      });

      if (localStorage.getItem('sb-collapsed') === '1') document.body.classList.add('sb-collapsed');
      const tgl = document.getElementById('sidebar-toggle');
      if (tgl) tgl.addEventListener('click', (e) => {
        e.stopPropagation();
        document.body.classList.toggle('sb-collapsed');
        localStorage.setItem('sb-collapsed', document.body.classList.contains('sb-collapsed') ? '1' : '0');
        setTimeout(() => window.dispatchEvent(new Event('resize')), 300);
      });
    })();
  </script>
</body>
</html>
